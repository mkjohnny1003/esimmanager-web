<style>

  #controls-dialog dd{margin:0;text-align:right;}
  #controls-dialog button{border:1px solid #245d3c;border-radius:6px;background:#245d3c;color:#fff;
    padding:10px 16px;font:700 15px/1.3 system-ui,sans-serif;}
</style>

<script>
(function(){
'use strict';

// ============================================================
// 這份檔案是 iOS 原生版（ios/Gutsy）的行為同步版，2026-09-15 跟著
// 原生版的一整輪規則同步：240×216 解析度、5 種戰術道具、World 1~3
// （含仙人掌／俄羅斯方塊障礙物）、10 子關卡制、難度、標準/地圖雙模式。
// 唯一刻意簡化的地方：原生版有合成的 chiptune BGM 跟實體搖桿支援，
// 這裡沒有對應物（純網頁音效用方波 beep，沒有背景音樂）。
// ============================================================

/* ---------- 調色盤 ---------- */
var P8=['#9bbc0f','#8bac0d','#7a9d0f','#688d14','#567c1b','#426a22','#2b5624','#0f380f'];
var P4=['#9bbc0f','#8bac0f','#306230','#0f380f'];
var M4=[0,0,1,1,2,2,2,3];
var pal8=true;
function K(i){i=i<0?0:(i>7?7:i);return pal8?P8[i]:P4[M4[i]];}

/* ---------- 常數（對應 Core/Constants.swift） ---------- */
var W=240,H=216,HUD=15;
var FX0=3,FY0=18,FX1=W-4,FY1=H-4;
var BASE_T=5,MIN_LEN=12;
var LAYER=[6,4,3,2,2,1,1];
var FOOD_W=[2,4,4,6,6,8,8,10];

var cv=document.getElementById('scr'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------- 難度（對應 Types.swift Difficulty） ---------- */
var DIFF={
  EASY:{label:'EASY',gutMax:22,obMul:1.25,speedOff:1.5},
  NORMAL:{label:'NORMAL',gutMax:18,obMul:1.0,speedOff:0},
  HARD:{label:'HARD',gutMax:15,obMul:0.75,speedOff:-1.0},
};
var DIFF_ORDER=['EASY','NORMAL','HARD'];
var difficulty='NORMAL';
function gutMax(){return DIFF[difficulty].gutMax;}

/* ---------- 關卡（對應 GameState 的關卡系統） ---------- */
var MAX_RELEASE_WORLD=3;
var SUBSTAGES_PER_WORLD=10;
var THEME_TITLE={1:'CLASSIC GRASS',2:'DESERT DUNES',3:'BRICK WORLD'};
function targetFood(sub){return sub<=5?5*sub:25+(sub-5)*3;}
function obstacleSpawnInterval(){return Math.max(3500,(12000-(currentSubStage-1)*900)*DIFF[difficulty].obMul);}
function maxObstaclesForSubStage(){return Math.min(10,2+currentSubStage);}

/* ---------- 障礙物：俄羅斯方塊格子表（對應 ObstacleKind.tetrominoCells） ---------- */
var TETRO_CELL_PX=6;
var TETRO_CELLS={
  I:[[0,0],[1,0],[2,0],[3,0]],
  O:[[0,0],[1,0],[0,1],[1,1]],
  T:[[0,0],[1,0],[2,0],[1,1]],
  S:[[1,0],[2,0],[0,1],[1,1]],
  Z:[[0,0],[1,0],[1,1],[2,1]],
  J:[[0,0],[0,1],[1,1],[2,1]],
  L:[[2,0],[0,1],[1,1],[2,1]],
};
var TETRO_KINDS=['I','O','T','S','Z','J','L'];

/* ---------- 仙人掌剪影（對應 Renderer.cactusLargeGlyph / cactusSmallGlyph） ---------- */
var CACTUS_LARGE=['....##....','....##....','##..##....','##..##....','##.###..##','##..##..##','##..##..##','##..##..##','##..##..##','##..##..##','##..##..##','##..##..##','##..##..##','##..##..##'];
var CACTUS_SMALL=['..##..','..##..','#.##..','#.##.#','#.##.#','#.##.#','#.##.#','#.##.#'];

/* ---------- 道具（對應 Types.swift PowerUpType） ---------- */
var POWERUP_TYPES=['poison','skates','bomb','diamond','enzyme'];
var POWERUP_WEIGHT={poison:25,skates:25,bomb:25,diamond:15,enzyme:10};
var ITEM_GLYPH={
  poison:['....#####....','....#+++#....','.....###.....','...#######...','..##+++++##..','.##++#+#++##.','.#++#####++#.','.#+++###+++#.','.#++#+#+#++#.','.##+++++++##.','..##+++++##..','...#######...','.............'],
  skates:['......#####..','...####+++##.','..#++#+++++#.','.#+++#+++++#.','##+++#######.','##++#++++++#.','.#++#++++++#.','.############','.#++++++++++#','..#++++++++#.','...########..','....##..##...','.............'],
  bomb:['......+......','......#+.....','.....###.....','....#####....','...##...##...','..##.###.##..','.##.##.##.##.','.##.##.##.##.','.##..###..##.','..##.....##..','...#######...','....#####....','.............'],
  diamond:['....#####....','..#########..','.###########.','#############','##+###+###+##','.#+++++++++#.','..#+++++++#..','...#+++++#...','....#+++#....','.....#+#.....','......#......','.............','.............'],
  enzyme:['....#####....','....#+++#....','....#####....','.....#+#.....','....##+##....','...##+++##...','..##+++++##..','.##++#+#++##.','.#++#####++#.','.#+++#+#+++#.','.#+++++++++#.','..#########..','.............'],
};

/* ---------- 3x5 點陣字 ---------- */
var F={'0':'111,101,101,101,111','1':'010,110,010,010,111','2':'111,001,111,100,111','3':'111,001,111,001,111','4':'101,101,111,001,001','5':'111,100,111,001,111','6':'111,100,111,101,111','7':'111,001,010,010,010','8':'111,101,111,101,111','9':'111,101,111,001,111','A':'111,101,111,101,101','B':'110,101,110,101,110','C':'111,100,100,100,111','D':'110,101,101,101,110','E':'111,100,111,100,111','F':'111,100,111,100,100','G':'111,100,101,101,111','H':'101,101,111,101,101','I':'111,010,010,010,111','J':'001,001,001,101,111','K':'101,101,110,101,101','L':'100,100,100,100,111','M':'101,111,111,101,101','N':'110,101,101,101,101','O':'111,101,101,101,111','P':'111,101,111,100,100','Q':'111,101,101,111,011','R':'111,101,111,110,101','S':'111,100,111,001,111','T':'111,010,010,010,010','U':'101,101,101,101,111','V':'101,101,101,101,010','W':'101,101,111,111,101','X':'101,101,010,101,101','Y':'101,101,010,010,010','Z':'111,001,010,100,111',' ':'000,000,000,000,000',':':'000,010,000,010,000','.':'000,000,000,000,010','-':'000,000,111,000,000','!':'010,010,010,000,010','+':'000,010,111,010,000','/':'001,001,010,100,100','%':'101,001,010,100,101'};

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h);}
function bx(x,y,s,c){px(x-(s>>1),y-(s>>1),s,s,c);}
function tw(s,k){k=k||1;return String(s).length*4*k-k;}
function txt(s,x,y,c,k){k=k||1;s=String(s).toUpperCase();var cx=x;
 for(var i=0;i<s.length;i++){var g=F[s[i]]||F[' '],r=g.split(',');
  for(var a=0;a<5;a++)for(var b=0;b<3;b++)if(r[a][b]==='1')px(cx+b*k,y+a*k,k,k,c);
  cx+=4*k;}}
function ctxt(s,y,c,k){txt(s,Math.round((W-tw(s,k))/2),y,c,k);}
function drawGlyph(glyph,x,y){for(var r=0;r<glyph.length;r++)for(var c=0;c<glyph[r].length;c++){var ch=glyph[r][c];
  if(ch==='#')px(x+c,y+r,1,1,K(6));else if(ch==='+')px(x+c,y+r,1,1,K(3));}}

/* ---------- 面板（對應 HUD.panel） ---------- */
function panel(y,h){var inset=(W>=200)?13:6;
 px(inset,y-1,W-inset*2,h+2,K(5));px(inset+1,y,W-(inset+1)*2,h,K(7));px(inset+3,y+2,W-(inset+3)*2,h-4,K(0));}

/* ============================================================
   狀態（對應 GameState.swift 的所有欄位）
   ============================================================ */
var phase='title',cause='';
var currentWorld=1,currentSubStage=1,stageFoodTarget=5,stageFoodCount=0,stageTransitionTimer=0;
var obstacles=[],obstacleSpawnTimer=0;
var skateMultiplier=1,invincibleRemaining=0,enzymeRemaining=0;
var scoreBonus=0;
var tGame=0,sinceEat=0,hungAcc=0,flash=0,acc=0;
var maxLen=0,eaten=0,best=0,gamesPlayed=0;
var runRecorded=false;
var titleMenuIndex=0,hasSuspendedRun=false;
var settingMenuIndex=0,wasInGame=false;
var debris=[],explosionTimer=0;
var lastStageWorld=1,lastStageSubStage=1;
var howToPlayPage=0,TOTAL_HOWTOPLAY_PAGES=3;
var pops=[],toast=0,toastS='';
var isMapMode=false,mapSelectWorld=1,mapSelectSubStage=1;
var muted=false,lastT=0;

var TITLE_ITEMS=[
 {key:'start',label:'START GAME'},
 {key:'mapMode',label:'MAP MODE'},
 {key:'continueStage',label:function(){return 'CONTINUE '+lastStageWorld+'-'+lastStageSubStage;}},
 {key:'settings',label:'SETTINGS'},
 {key:'howToPlay',label:'HOW TO PLAY'},
];
var SETTING_ITEMS=['bgm','palette','difficulty','returnHome','back'];

/* ---------- 蛇（對應 SnakeModel.swift） ---------- */
var pts,dir,inputQueue,tgt,sinceTurn;
function snakeReset(sx,sy){
 pts=[{x:sx,y:sy},{x:sx-24,y:sy}];dir={x:1,y:0};inputQueue=[];tgt=24;sinceTurn=9;}
function plen(){var l=0;for(var i=0;i<pts.length-1;i++)l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y);return l;}
function samp(){var o=[],d=0;
 for(var i=0;i<pts.length-1;i++){var a=pts[i],b=pts[i+1];
  var ux=Math.sign(b.x-a.x),uy=Math.sign(b.y-a.y),n=Math.abs(b.x-a.x)+Math.abs(b.y-a.y);
  for(var k=0;k<n;k++){o.push({x:a.x+ux*k,y:a.y+uy*k,d:d});d++;}}
 var t=pts[pts.length-1];o.push({x:t.x,y:t.y,d:d});return o;}
function trim(){var ex=plen()-tgt,guard=0;
 while(ex>0&&guard++<400){
  var a=pts[pts.length-2],b=pts[pts.length-1];
  var sl=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
  if(sl<=ex&&pts.length>2){pts.pop();ex-=sl;}
  else{var ux=Math.sign(a.x-b.x),uy=Math.sign(a.y-b.y),m=Math.min(ex,sl);
   b.x+=ux*m;b.y+=uy*m;ex-=m;if(m===0)break;}}}
function thick(d,L,lumpsArr){
 var t=BASE_T;
 for(var i=0;i<lumpsArr.length;i++){var l=lumpsArr[i],hw=Math.max(4,l.size+1),dd=Math.abs(d-l.pos);
  if(dd<hw)t+=l.size*0.62*(1-dd/hw)*(l.tl/l.tt);}
 if(L-d<6)t-=2.4*(1-(L-d)/6);
 return 2*Math.round((Math.max(2.5,t)-1)/2)+1;}

/* ---------- 消化（對應 DigestionSystem.swift） ---------- */
var lumps=[];
function digClear(){lumps=[];}
function gut(){var g=0;for(var i=0;i<lumps.length;i++)g+=lumps[i].size*(lumps[i].tl/lumps[i].tt);return g;}
function addLump(size){var tt=size*900;lumps.push({size:size,pos:0,tl:tt,tt:tt,gain:size/2});}

/* ---------- 生成（對應 SpawnSystem.swift） ---------- */
var foods=[],powerUps=[];
var TARGET_ITEM_COUNT=3,MAX_POWERUPS=1;
function isFree(x,y,r,snakeArr,obArr,compact){
 var clr=compact?9:13;
 for(var i=0;i<snakeArr.length;i++)if(Math.abs(snakeArr[i].x-x)<r&&Math.abs(snakeArr[i].y-y)<r)return false;
 for(var j=0;j<foods.length;j++)if(Math.abs(foods[j].x-x)<clr&&Math.abs(foods[j].y-y)<clr)return false;
 for(var k=0;k<powerUps.length;k++)if(Math.abs(powerUps[k].x-x)<clr&&Math.abs(powerUps[k].y-y)<clr)return false;
 for(var m=0;m<obArr.length;m++){var ob=obArr[m];
  if(x+r>=ob.x&&x-r<=ob.x+ob.w&&y+r>=ob.y&&y-r<=ob.y+ob.h)return false;}
 return true;}
function spawnFood(snakeArr,obArr){
 if(foods.length+powerUps.length>=TARGET_ITEM_COUNT)return;
 var sz=FOOD_W[(Math.random()*FOOD_W.length)|0];
 var compact=(FX1-FX0)<150;
 var spanX=Math.max(4,FX1-FX0-sz-4),spanY=Math.max(4,FY1-FY0-sz-4);
 for(var t=0;t<40;t++){
  var x=FX0+4+((Math.random()*spanX)|0),y=FY0+4+((Math.random()*spanY)|0);
  x&=~1;y&=~1;
  if(isFree(x+sz/2,y+sz/2,7,snakeArr,obArr,compact)){foods.push({x:x,y:y,s:sz,life:10000+Math.random()*6000});return;}}
 for(var t2=0;t2<30;t2++){
  var x2=FX0+3+((Math.random()*spanX)|0),y2=FY0+3+((Math.random()*spanY)|0);
  x2&=~1;y2&=~1;
  if(isFree(x2+sz/2,y2+sz/2,4,snakeArr,obArr,compact)){foods.push({x:x2,y:y2,s:sz,life:10000+Math.random()*6000});return;}}}
function spawnPowerUp(snakeArr,obArr){
 if(powerUps.length>=MAX_POWERUPS||foods.length+powerUps.length>=TARGET_ITEM_COUNT)return;
 var roll=(Math.random()*100)|0,type,acc2=0,chosen=null;
 for(var i=0;i<POWERUP_TYPES.length;i++){acc2+=POWERUP_WEIGHT[POWERUP_TYPES[i]];if(roll<acc2){chosen=POWERUP_TYPES[i];break;}}
 type=chosen||'enzyme';
 var compact=(FX1-FX0)<150;
 var spanX=Math.max(6,FX1-FX0-18),spanY=Math.max(6,FY1-FY0-18);
 for(var t=0;t<40;t++){
  var x=FX0+6+((Math.random()*spanX)|0),y=FY0+6+((Math.random()*spanY)|0);
  x&=~1;y&=~1;
  if(isFree(x+4,y+4,7,snakeArr,obArr,compact)){powerUps.push({x:x,y:y,type:type,life:12000});return;}}}
function replenish(snakeArr,obArr){
 var attempts=0;
 while((foods.length+powerUps.length)<TARGET_ITEM_COUNT&&attempts<8){
  attempts++;
  var needFood=foods.length<2;
  var rollPowerUp=(powerUps.length<MAX_POWERUPS)&&(Math.random()<0.35);
  if(!needFood&&rollPowerUp)spawnPowerUp(snakeArr,obArr);else spawnFood(snakeArr,obArr);}}
function spawnTick(dt,snakeArr,obArr){
 var removedAny=false;
 for(var i=foods.length-1;i>=0;i--){foods[i].life-=dt;if(foods[i].life<=0){foods.splice(i,1);removedAny=true;}}
 for(var j=powerUps.length-1;j>=0;j--){powerUps[j].life-=dt;if(powerUps[j].life<=0){powerUps.splice(j,1);removedAny=true;}}
 if(removedAny||(foods.length+powerUps.length)<TARGET_ITEM_COUNT)replenish(snakeArr,obArr);}
function spawnRandomObstacle(world,snakeArr,obArr){
 var kind,w,h,cells=[];
 if(world===2){
  if(Math.random()<0.5){kind='cactusSmall';w=6;h=8;}else{kind='cactusLarge';w=10;h=14;}
 }else{
  kind=TETRO_KINDS[(Math.random()*TETRO_KINDS.length)|0];
  cells=TETRO_CELLS[kind];
  var maxCol=0,maxRow=0;
  for(var i=0;i<cells.length;i++){maxCol=Math.max(maxCol,cells[i][0]);maxRow=Math.max(maxRow,cells[i][1]);}
  w=(maxCol+1)*TETRO_CELL_PX;h=(maxRow+1)*TETRO_CELL_PX;}
 var spanX=Math.max(10,FX1-FX0-20-w),spanY=Math.max(10,FY1-FY0-20-h);
 var head=snakeArr[0];
 var safeDist=Math.min(36,Math.min(FX1-FX0,FY1-FY0)*0.35);
 for(var t=0;t<50;t++){
  var x=FX0+10+((Math.random()*spanX)|0),y=FY0+10+((Math.random()*spanY)|0);
  x&=~1;y&=~1;
  if(head){var dx=x-head.x,dy=y-head.y;if((dx*dx+dy*dy)<safeDist*safeDist)continue;}
  if(isFree(x+w/2,y+h/2,Math.max(w,h)/2+4,snakeArr,obArr,false)){
   obArr.push({x:x,y:y,w:w,h:h,kind:kind,warningTimer:1200,life:20000,cells:cells});return true;}}
 return false;}

function beep(f,d,v){if(muted)return;

  var a=window._ac,o=a.createOscillator(),g=a.createGain();

  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);}catch(e){}}

function loadStage(world,sub,updateSave){

 obstacles=[];obstacleSpawnTimer=obstacleSpawnInterval();
 if(world>=2){
  var initialCount=Math.min(3,1+((sub/2)|0));
  for(var i=0;i<initialCount;i++)spawnRandomObstacle(world,samp(),obstacles);
  for(var j=0;j<obstacles.length;j++)obstacles[j].warningTimer=0;}
 if(updateSave)saveLastStage(world,sub);}

function saveLastStage(world,sub){

   輸入
   ============================================================ */
function press(d){
 if(phase==='title'){
  if(d!=='U'&&d!=='D')return;
  var n=TITLE_ITEMS.length;titleMenuIndex=(titleMenuIndex+(d==='D'?1:-1)+n)%n;beep(500,0.03,0.02);return;}
 if(phase==='mapSelect'){
  if(d==='L'||d==='R'){var n=MAX_RELEASE_WORLD;mapSelectWorld=((mapSelectWorld-1)+(d==='R'?1:-1)+n)%n+1;mapSelectSubStage=1;beep(560,0.03,0.03);return;}
  if(d==='U'||d==='D'){var n2=SUBSTAGES_PER_WORLD;mapSelectSubStage=((mapSelectSubStage-1)+(d==='D'?1:-1)+n2)%n2+1;beep(500,0.03,0.02);return;}}
 if(phase==='settings'){
  if(d==='U'||d==='D'){settingMenuIndex=(settingMenuIndex+(d==='D'?1:-1)+SETTING_ITEMS.length)%SETTING_ITEMS.length;beep(500,0.03,0.02);return;}
  if(d==='L'||d==='R'){
   var item=SETTING_ITEMS[settingMenuIndex],delta=(d==='R'?1:-1);
   if(item==='palette'){pal8=!pal8;beep(pal8?880:440,0.03,0.03);}
   else if(item==='difficulty'){
    var idx=DIFF_ORDER.indexOf(difficulty),next=(idx+delta+DIFF_ORDER.length)%DIFF_ORDER.length;
    difficulty=DIFF_ORDER[next];try{localStorage.setItem('gutsy2:diff',difficulty);}catch(e){}
    beep(500+next*120,0.03,0.03);}
   return;}
  return;}
 if(phase==='howToPlay'){
  if(d!=='L'&&d!=='R')return;
  var delta=(d==='R'?1:-1);howToPlayPage=(howToPlayPage+delta+TOTAL_HOWTOPLAY_PAGES)%TOTAL_HOWTOPLAY_PAGES;beep(540,0.03,0.02);return;}
 if(phase!=='play')return;
 var nd={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}}[d];if(!nd)return;
 var last=inputQueue.length?inputQueue[inputQueue.length-1]:dir;
 var isRev=nd.x===-last.x&&nd.y===-last.y,isSame=nd.x===last.x&&nd.y===last.y;
 if(!isRev&&!isSame&&inputQueue.length<2)inputQueue.push(nd);}

function act(b){
 if(b==='A'||b==='STA'){
  if(phase==='title'){
   var item=TITLE_ITEMS[titleMenuIndex].key;
   if(item==='start'){isMapMode=false;reset();phase='play';beep(660,0.08);}
   else if(item==='mapMode'){mapSelectWorld=currentWorld;mapSelectSubStage=currentSubStage;phase='mapSelect';beep(660,0.06);}
   else if(item==='continueStage'){
    if(hasSuspendedRun){hasSuspendedRun=false;phase='pause';beep(660,0.06);}
    else{isMapMode=false;startAtLastStage();}}
   else if(item==='settings'){wasInGame=false;settingMenuIndex=0;phase='settings';beep(660,0.06);}
   else if(item==='howToPlay'){howToPlayPage=0;phase='howToPlay';beep(660,0.06);}
  }else if(phase==='mapSelect'){
   isMapMode=true;startAtStage(mapSelectWorld,mapSelectSubStage);beep(660,0.08);
  }else if(phase==='settings'){
   var it=SETTING_ITEMS[settingMenuIndex];
   if(it==='bgm'||it==='palette'||it==='difficulty')press('R');
   else if(it==='returnHome'){wasInGame=false;hasSuspendedRun=false;phase='title';beep(440,0.06);}
   else if(it==='back'){if(wasInGame){wasInGame=false;phase='play';beep(660,0.04);}else{phase='title';beep(440,0.06);}}
  }else if(phase==='howToPlay'){
   if(howToPlayPage<TOTAL_HOWTOPLAY_PAGES-1){howToPlayPage++;beep(540,0.03,0.02);}else{phase='title';beep(440,0.06);}
  }else if(phase==='over'){
   startAtStage(currentWorld,currentSubStage);beep(660,0.08);
  }else if(phase==='gameComplete'){
   isMapMode=false;reset();phase='play';beep(660,0.08);
  }else if(phase==='play'){phase='pause';
  }else if(phase==='pause'){phase='play';lastT=0;
  }else if(phase==='stageClear'){stageTransitionTimer=0;
  }
 }else if(b==='B'){
  if(phase==='pause'){phase='play';lastT=0;}
  else if(phase==='play'){phase='pause';}
  else if(phase==='settings'){if(wasInGame){wasInGame=false;phase='play';beep(660,0.04);}else{phase='title';beep(440,0.06);}}
  else if(phase==='howToPlay'||phase==='mapSelect'){phase='title';beep(440,0.06);}
 }else if(b==='SEL'){
  if(phase==='play'||phase==='pause'){wasInGame=true;settingMenuIndex=0;phase='settings';beep(600,0.04);return;}
  if(phase==='title'){pal8=!pal8;toastS=pal8?'8 SHADES':'4 SHADES DMG';toast=1400;beep(pal8?880:440,0.05);}
 }}

function applyPowerUp(type,pos){

  else{digClear();tgt=Math.max(MIN_LEN-1,tgt-3);flash=200;pop(pos.x,pos.y,'PURGED -3');beep(300,0.08);

 }else if(type==='bomb'){
  if(invinc){flash=120;scoreBonus+=100;pop(pos.x,pos.y,'+100');beep(400,0.08);setTimeout(function(){beep(800,0.1);},60);}

 }}

function score(){return scoreBonus+maxLen*5+Math.floor(tGame/1000)*2;}
function pop(x,y,s){pops.push({x:x,y:y,s:s,t:900});}

/* ============================================================
   每幀推進（對應 GameState.advanceFrame / upd / step）
   ============================================================ */
function iv(){
 var worldBonus=(currentWorld-1)*1.5;
 var base=Math.max(10,20+DIFF[difficulty].speedOff-worldBonus-tGame/7000);
 var fullness=Math.min(1,gut()/gutMax());
 var weightPenalty=1+fullness*0.95;
 return Math.max(4,base*weightPenalty*skateMultiplier);}

function upd(dt){
 tGame+=dt;sinceEat+=dt;if(flash>0)flash-=dt;
 if(invincibleRemaining>0)invincibleRemaining-=dt;
 if(enzymeRemaining>0)enzymeRemaining-=dt;

 var digestDt=(enzymeRemaining>0)?dt*3:dt;
 for(var i=lumps.length-1;i>=0;i--){lumps[i].tl-=digestDt;
  if(lumps[i].tl<=0){
   tgt+=lumps[i].gain;maxLen=Math.max(maxLen,tgt);
   var s=samp(),p=s[Math.min(s.length-1,Math.round(lumps[i].pos))];
   pop(p.x,p.y,'+'+lumps[i].gain);beep(760,0.05);lumps.splice(i,1);}}
 maxLen=Math.max(maxLen,tgt);

 var sample=samp();
 spawnTick(dt,sample,obstacles);replenish(sample,obstacles);

 if(sinceEat>6000){hungAcc+=dt;
  if(hungAcc>2000){hungAcc=0;tgt-=1;if(tgt<MIN_LEN){die('EMPTY');return;}}}

 for(var k=0;k<obstacles.length;k++){
  if(obstacles[k].warningTimer>0){obstacles[k].warningTimer-=dt;
   if(obstacles[k].warningTimer<=0){obstacles[k].warningTimer=0;beep(200,0.05);}}}

 var expired=0;
 for(var m=0;m<obstacles.length;m++){
  if(obstacles[m].warningTimer<=0){obstacles[m].life-=dt;if(obstacles[m].life<=0)expired++;}}
 if(expired>0){
  obstacles=obstacles.filter(function(o){return !(o.warningTimer<=0&&o.life<=0);});
  for(var e=0;e<expired;e++)spawnRandomObstacle(currentWorld,sample,obstacles);}

 if(currentWorld>=2){
  obstacleSpawnTimer-=dt;
  if(obstacleSpawnTimer<=0){obstacleSpawnTimer=obstacleSpawnInterval();
   if(obstacles.length<maxObstaclesForSubStage())spawnRandomObstacle(currentWorld,sample,obstacles);}}

 for(var p=pops.length-1;p>=0;p--){pops[p].t-=dt;pops[p].y-=dt*0.012;if(pops[p].t<=0)pops.splice(p,1);}}

function step(){
 if(sinceTurn>=BASE_T&&inputQueue.length){
  var nd=inputQueue.shift();
  var isRev=nd.x===-dir.x&&nd.y===-dir.y,isSame=nd.x===dir.x&&nd.y===dir.y;
  if(!isRev&&!isSame){pts.unshift({x:pts[0].x,y:pts[0].y});dir=nd;sinceTurn=0;}}

 pts[0].x+=dir.x;pts[0].y+=dir.y;sinceTurn++;
 var cap=Math.max(4,tgt-4);for(var i=0;i<lumps.length;i++)lumps[i].pos=Math.min(lumps[i].pos+1,cap);
 trim();

 var h=pts[0];
 if(h.x<FX0+2||h.x>FX1-2||h.y<FY0+2||h.y>FY1-2){die('WALL');return;}

 var s=samp(),L=s.length-1,hr=thick(0,L,lumps);
 var invinc=invincibleRemaining>0;

 if(!invinc){
  var margin=hr/2;
  for(var o=0;o<obstacles.length;o++){var ob=obstacles[o];if(ob.warningTimer>0)continue;
   if(!ob.cells||!ob.cells.length){
    if(h.x>=ob.x-margin&&h.x<=ob.x+ob.w+margin&&h.y>=ob.y-margin&&h.y<=ob.y+ob.h+margin){die('HAZARD');return;}
   }else{
    for(var c=0;c<ob.cells.length;c++){
     var cx=ob.x+ob.cells[c][0]*TETRO_CELL_PX,cy=ob.y+ob.cells[c][1]*TETRO_CELL_PX;
     if(h.x>=cx-margin&&h.x<=cx+TETRO_CELL_PX+margin&&h.y>=cy-margin&&h.y<=cy+TETRO_CELL_PX+margin){die('HAZARD');return;}}}}}

 if(!invinc){
  for(var k=0;k<s.length;k++){
   if(s[k].d<BASE_T*3)continue;
   var r2=thick(s[k].d,L,lumps),lim=(hr+r2)/2-2;
   if(Math.abs(s[k].x-h.x)<lim&&Math.abs(s[k].y-h.y)<lim){die('BITE');return;}}}

 for(var fi=foods.length-1;fi>=0;fi--){
  var f=foods[fi],cxx=f.x+f.s/2,cyy=f.y+f.s/2;
  if(Math.abs(cxx-h.x)<(hr+f.s)/2+1&&Math.abs(cyy-h.y)<(hr+f.s)/2+1){
   addLump(f.s);foods.splice(fi,1);eaten++;stageFoodCount++;sinceEat=0;hungAcc=0;
   var gained=f.s<5?10:(f.s<7?25:(f.s<9?50:100));
   scoreBonus+=gained;pop(cxx,cyy,'+'+gained);beep(520+f.s*40,0.06);
   if(gut()>gutMax()&&!invinc){die('BURST');return;}
   if(stageFoodCount>=stageFoodTarget){triggerStageClear();return;}
   replenish(s,obstacles);}}

 for(var pi=powerUps.length-1;pi>=0;pi--){
  var pu=powerUps[pi],pcx=pu.x+4,pcy=pu.y+4;
  if(Math.abs(pcx-h.x)<hr/2+5&&Math.abs(pcy-h.y)<hr/2+5){
   powerUps.splice(pi,1);applyPowerUp(pu.type,h);replenish(s,obstacles);}}}

function advanceFrame(dt){
 if(toast>0)toast-=dt;

 if(phase==='exploding'){
  explosionTimer-=dt;if(flash>0)flash-=dt;
  for(var i=0;i<debris.length;i++){debris[i].x+=debris[i].vx*dt;debris[i].y+=debris[i].vy*dt;debris[i].life-=dt;}
  if(explosionTimer<=0)finishExplosionDeath();
  return;}

 if(phase==='stageClear'){
  stageTransitionTimer-=dt;
  if(stageTransitionTimer<=0){
   if(currentSubStage<SUBSTAGES_PER_WORLD){
    scoreBonus+=100;loadStage(currentWorld,currentSubStage+1,!isMapMode);skateMultiplier=1;phase='play';beep(880,0.1);
   }else if(currentWorld<MAX_RELEASE_WORLD){
    scoreBonus+=500;loadStage(currentWorld+1,1,!isMapMode);skateMultiplier=1;phase='play';beep(880,0.1);
   }else{scoreBonus+=500;phase='gameComplete';recordRun(true);}}
  return;}

 if(phase!=='play')return;
 upd(dt);if(phase!=='play')return;
 acc+=dt;var g=0;
 while(acc>=iv()&&g++<6){acc-=iv();step();if(phase!=='play')break;}}

/* ============================================================
   繪製（對應 Render/Renderer.swift + HUD.swift）
   ============================================================ */
function drawField(){
 px(0,HUD,W,H-HUD,K(7));
 px(1,HUD+1,W-2,H-HUD-2,K(6));
 var flashing=flash>0&&(((flash/60)|0)%2===0);
 var bg=flashing?K(2):K(0);
 px(FX0,FY0,FX1-FX0+1,FY1-FY0+1,bg);
 if(!flashing){
  if(currentWorld===2){
   for(var y=FY0+4;y<FY1-4;y+=8)for(var x=FX0+4;x<FX1-4;x+=8)px(x+((y%16===0)?4:0),y,1,1,K(1));
  }else if(currentWorld===3){
   for(var y2=FY0;y2<FY1;y2+=16)px(FX0,y2,FX1-FX0+1,1,K(1));

async function loadScores(){
 scoreList.replaceChildren();
 if(!scoreApi){scoreStatus.textContent=messages.unavailable;return;}
 scoreStatus.textContent=messages.loading;
 try{
  var res=await fetch(scoreApi+'/scores');
  if(!res.ok)throw new Error('HTTP '+res.status);
  var rows=(await res.json()).scores;
  rows.forEach(function(row){
   var item=document.createElement('li');
   item.textContent=row.name+' · '+row.world+'-'+row.stage;
   var points=document.createElement('span');points.textContent=String(row.score);
   item.appendChild(points);scoreList.appendChild(item);});
  scoreStatus.textContent=rows.length?'':messages.empty;
 }catch(e){scoreStatus.textContent=messages.loadError;}}

  var run=Object.assign({},pendingRun,{name:name});
  var res=await fetch(scoreApi+'/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(run)});

  try{localStorage.setItem('gutsy2:playerName',name);}catch(e){}
  setPending(null);document.getElementById('run-result').hidden=true;
  await loadScores();scoreStatus.textContent=messages.saved;

scoreDialog.addEventListener('cancel',function(e){e.preventDefault();closeScores();});
try{
 var stored=JSON.parse(localStorage.getItem('gutsy2:pendingScore'));
 if(stored&&stored.id)setPending(stored);
 document.getElementById('player-name').value=localStorage.getItem('gutsy2:playerName')||'';
}catch(e){}

var wrap=document.getElementById('gbwrap');
wrap.querySelectorAll('[data-d]').forEach(function(el){
 el.addEventListener('pointerdown',function(e){e.preventDefault();press(el.getAttribute('data-d'));});});
wrap.querySelectorAll('[data-b]').forEach(function(el){
 el.addEventListener('pointerdown',function(e){e.preventDefault();act(el.getAttribute('data-b'));});});
document.getElementById('led').addEventListener('click',function(e){e.preventDefault();mute();});

window.addEventListener('keydown',function(e){
 if(controlsDialog.open||scoreDialog.open||e.target.tagName==='INPUT')return;
 var k=e.key;
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(k)>=0)e.preventDefault();
 if(k==='ArrowUp'||k==='w')press('U');
 else if(k==='ArrowDown'||k==='s')press('D');
 else if(k==='ArrowLeft'||k==='a')press('L');
 else if(k==='ArrowRight'||k==='d')press('R');
 else if(k===' '||k==='Enter'||k==='z')act('A');
 else if(k==='p'||k==='x'||k==='Escape')act('B');
 else if(k==='c')act('SEL');
 else if(k==='m')mute();});

var sx=0,sy=0;
cv.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',function(e){
 var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)<14&&Math.abs(dy)<14){act('A');return;}
 if(Math.abs(dx)>Math.abs(dy))press(dx>0?'R':'L');else press(dy>0?'D':'U');},{passive:true});

/* ---------- 讀存檔並啟動 ---------- */
try{
 var b=localStorage.getItem('gutsy2:best');if(b)best=parseInt(b,10)||0;
 var gm=localStorage.getItem('gutsy2:games');if(gm)gamesPlayed=parseInt(gm,10)||0;
 var lw=localStorage.getItem('gutsy2:lastWorld');if(lw)lastStageWorld=parseInt(lw,10)||1;
 var ls=localStorage.getItem('gutsy2:lastSub');if(ls)lastStageSubStage=parseInt(ls,10)||1;
 var df=localStorage.getItem('gutsy2:diff');if(df&&DIFF[df])difficulty=df;
}catch(e){}
reset();phase='title';
if(window.matchMedia('(min-width:900px)').matches)controlsDialog.showModal();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
